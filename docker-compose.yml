# Base PostgreSQL pour le développement local uniquement.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ollisante-postgres
    environment:
      POSTGRES_DB: ollisante
      POSTGRES_USER: ollisante
      POSTGRES_PASSWORD: ollisante_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ollisante-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ollisante-pgdata:
